# What is deliberately NOT a metric target (so a regenerated app does not invent one)
no_target_by_design:
  - {item: latency, reason: "PNFR-06 has no target (unknown, OPD-14): measure-only. An invented p95 would be a fabricated number."}
  - {item: "RTO / RPO", reason: "Agent targets (RTO 4 working hours, RPO 1 working day), verified by restore rehearsal only; not approved."}
  - {item: throughput_capacity, reason: "No target exists (D-28-06)."}
  - {item: roi_npv_payback, reason: "NOT COMPUTABLE: no after-window, no volumes, no finance-approved rate."}
no_target_evidence: [docs/31-observability/slo-sla-definitions.md, docs/final-prd/final-economics-baseline.md]

    entity: IntakeOutcome
    meaning_status: defined
    ordered: true
    note: "Fixed precedence, highest first. The first applicable code is primary_reason; all applicable codes are listed. Class-monotone: all QUARANTINE codes, then EXCEPTION, then FLAG."
    values:
      - {value: UNSUPPORTED_REVISION,   class: QUARANTINE, queue: quarantine_invalid}
      - {value: INVALID_JSON,           class: QUARANTINE, queue: quarantine_invalid}
      - {value: MISSING_ENVELOPE_FIELD, class: QUARANTINE, queue: quarantine_invalid}
      - {value: UNKNOWN_RECORD_KIND,    class: QUARANTINE, queue: quarantine_invalid}
      - {value: MISSING_PAYLOAD_FIELD,  class: QUARANTINE, queue: quarantine_invalid}
      - {value: CONTRACT_VIOLATION,     class: QUARANTINE, queue: quarantine_invalid, note: "Only when the source contract is bound in enforce mode."}
      - {value: REVISED_CONFLICT,       class: QUARANTINE, queue: revision_review}
      - {value: UNPARSABLE_AMOUNT,      class: QUARANTINE, queue: quarantine_invalid}
      - {value: NO_BUSINESS_KEY,        class: EXCEPTION,  queue: unmatched}
      - {value: AMBIGUOUS_MATCH,        class: EXCEPTION,  queue: ambiguous_match}
      - {value: UNMATCHED_REF,          class: EXCEPTION,  queue: unmatched}
      - {value: NEGATIVE_VALUE,         class: FLAG,       queue: flagged_value}
      - {value: UNKNOWN_UNIT,           class: FLAG,       queue: flagged_value}
      - {value: UNKNOWN_CURRENCY,       class: FLAG,       queue: flagged_value}
      - {value: IDENTIFIER_PATTERN,     class: FLAG,       queue: flagged_value}
    epistemic_status: verified_fact
    evidence: [hub/intake/reasons.py, docs/12-specs/business-rules.md]

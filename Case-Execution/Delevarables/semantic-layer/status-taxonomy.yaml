# Semantic Layer — taxonomies, status vocabularies and controlled value sets
#
# CENTRAL SEMANTIC FINDING (do not "simplify" this away):
#   The estate uses at least EIGHT incompatible status vocabularies. The word CLOSED appears in four of them
#   (case, batch QA, deviation, enterprise object/task) with no evidence that it means the same thing. The meaning of
#   "closed", "resolved" and "approved" is UNOWNED (decision gap RC-3 / OPD-01). Therefore:
#     * a regenerated application MUST NOT map one vocabulary onto another automatically;
#     * any mapping is a PolicyObject adopted by a human (Zone H);
#     * figures that depend on "closed" MUST carry a definition tag (D-OPS, D-EVID, D-FIN) and are never combined across tags.
#
# kind values: status_vocabulary | event_type | outcome | reason_code | queue | role | classification | mode | identifier | dimension | autonomy | epistemic
# meaning_status: defined | unknown | proposal   (unknown = the repo does not say what the value means in the real organisation)

semantic_layer_version: "0.1.0"
kind: taxonomy
cross_vocabulary_mapping:
  policy: forbidden_unless_adopted_policy
  statement: "Vocabularies are never mapped to each other automatically. A mapping exists only as an adopted PolicyObject (Zone H, ZH-05)."
  epistemic_status: verified_fact
  evidence: [docs/11-data-context/knowledge-model.md, docs/12-specs/business-rules.md]
role_tags:
  - {tag: closing_label,  value: CLOSED,   vocabulary: vocab.case_status, note: "Spec convenience used only when no CLOSURE policy is active (assumption A-12-F01-2); it is not a definition of 'closed'."}
  - {tag: reopened,       value: REOPENED, vocabulary: vocab.case_status}


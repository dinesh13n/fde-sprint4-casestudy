items:
  - {id: SBR-DEC-01, param: false, statement: "`decision_events` rows are insert-only. `seq` per case is gapless from 1. Corrections are new events referencing the corrected `event_id`; no event is ever altered or removed.", implements: "FR-DEC-01; BR-07; RC-2", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-DEC-02, param: false, statement: "`recorded_at` is server UTC and not client-settable. `occurred_at <= recorded_at` and `occurred_at >= occurred_at` of the previous event of the same case.", implements: "FR-DEC-02; PNFR-17", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-DEC-03, param: true, statement: "**Closing-state set.** (a) If a CLOSURE policy is active (selected by ZH-05 and status adopted or accepted-open) the closing set is `body.closing_states` of that policy. (b) If none is active, behaviour follows `closure.unconfigured_behaviour`: `treat_label_CLOSED_as_closing` (**default**; every transition into a state whose vocabulary role tag is `closing_label` is checked, fail-closed) or `none` (no check; events flagged `closure_check = not_configured`). The choice of (b) value is Zone H configuration (ZH-08-class) and is open decision OD-S12-03.", implements: "FR-DEC-05; BR-09; RC-3", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-DEC-04, param: false, statement: "A closing transition requires >= 1 `evidence_ref` that resolves to an existing evidence record **or** an accepted `close_exception` (Zone H). Sufficiency is never evaluated; it is policy (OPD-07, OD-S12-07).", implements: "FR-DEC-05; BR-09", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-DEC-05, param: false, statement: "Imported legacy REOPENED cases without a reopen event carry the marker `LEGACY_UNEVIDENCED_REOPEN`; the invariant 'no REOPENED case without a REOPEN event' is evaluated on non-marked cases and the marked ones are listed. No reopen event is invented.", implements: "FR-DEC-03; DQ-16", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-DEC-06, param: false, statement: "A REOPEN event increments `cycle`; the three fact events (FACT_RECEIVED, FACT_OPS_CLOSED, FACT_EVIDENCE_COMPLETE) belong to a cycle. Elapsed time under a clock is computed per completed cycle.", implements: "FR-DEC-06; FR-MET-03", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-DEC-07, param: false, statement: "Transition legality: `structural` mode permits any change between two distinct states of the case vocabulary except Zone H ones; a strict table may replace it (OD-S12-16). Vocabularies are never mapped to each other.", implements: "FR-DEC-01; FR-POL-01", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-GATE-01, param: false, statement: "The Zone H action list ZH-01..ZH-10 is closed. An action outside the list cannot be accepted (E-GATE-UNKNOWN-ACTION).", implements: "FR-GATE-03", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-GATE-02, param: false, statement: "A Zone H action is accepted iff: interactive human session AND principal in `zone_h.holders` AND role dispositioner AND re-authentication within `zone_h.reauth_window_seconds` AND mode/values permit the action AND `pack_hash` current (for ZH-01..03). Any other combination is rejected and audited. No setting disables a condition.", implements: "FR-GATE-01; FR-GATE-03; FR-GATE-04; BR-08", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-GATE-03, param: true, statement: "Disposition recording follows `disposition.mode` in {none (default), event, external_ref}; the mode in force at write time is stored on the event; past events are never rewritten.", implements: "FR-GATE-05; OPD-05", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-GATE-04, param: false, statement: "Override, dismiss or refuse of any rule-generated item is always accepted from an authenticated reviewer-class role when a non-empty reason is supplied; the original output is retained.", implements: "FR-GATE-06; PNFR-15", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-GATE-05, param: false, statement: "Inbound text, rule output, report content, search results and template content never populate a disposition value or trigger a Zone H event.", implements: "FR-GATE-01; FR-INT-07", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-POL-01, param: false, statement: "Policy object versions and rule rows are immutable; change = new version; each change is a `policy_events` row with old value, new value, actor, time and a non-empty `authority_ref`.", implements: "FR-POL-03", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-POL-02, param: false, statement: "The shipped product contains no policy object with status `adopted`, no active rule set, no `disposition.mode` other than `none`, no holder, and no enabled schedule.", implements: "FR-POL-01; FR-GATE-04; FR-RUN-01; CG-7", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-POL-03, param: false, statement: "`evaluate()` is pure: output = f(rule-set version, inputs).", implements: "FR-POL-04; PNFR-17", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-POL-04, param: true, statement: "**Defaulted marker.** An outcome carries `defaulted = true` if no row matches or an input is outside the field's declared domain; the as-found default value is retained and marked until a decision under OPD-04 / HAR-06 says otherwise.", implements: "FR-POL-06; BR-13", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-POL-05, param: false, statement: "As-found rule sets are read-only; custom sets are separate objects.", implements: "FR-POL-04; FR-CO-01", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-POL-06, param: true, statement: "A pass/fail verdict on a clock exists only when the clock is `adopted` and `duration_hours` is set; otherwise only elapsed times are reported.", implements: "FR-POL-02", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-POL-07, param: false, statement: "Adopted versions of the same (`kind`, `definition_tag`) cannot have overlapping effective windows.", implements: "FR-POL-01", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-POL-08, param: false, statement: "Boundary convention for a duration check: within the clock iff `elapsed <= duration` (inclusive) in the clock's calendar basis. [Assumption; owner of the clock may change it as policy.]", implements: "FR-POL-02", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-INT-01, param: true, statement: "**Item identity.** `identity_key = sha256(canonical([source, partner, record_kind, ref_id, source_ts]))`. `business_key` and `feed_id` are not identities (FND-INT-2). Identity-key definition per source is configuration; the feed definition is OD-S12-17.", implements: "FR-INT-02; FR-INT-03; RC-6", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-INT-02, param: false, statement: "`content_hash = sha256(canonical({schema_rev, payload}))`, canonical = UTF-8, sorted keys, no insignificant whitespace; transport fields excluded.", implements: "FR-INT-02; FR-INT-03", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-INT-03, param: false, statement: "**Reason precedence** (highest first): UNSUPPORTED_REVISION, INVALID_JSON, MISSING_ENVELOPE_FIELD, UNKNOWN_RECORD_KIND, MISSING_PAYLOAD_FIELD, CONTRACT_VIOLATION (enforce only), REVISED_CONFLICT, UNPARSABLE_AMOUNT, NO_BUSINESS_KEY, AMBIGUOUS_MATCH, UNMATCHED_REF, NEGATIVE_VALUE, UNKNOWN_UNIT, UNKNOWN_CURRENCY, IDENTIFIER_PATTERN. The first applicable is `primary_reason`; all applicable are in `all_reasons`.", implements: "FR-INT-06", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-INT-04, param: false, statement: "Order of stages: store raw -> identity/hash comparison (NOOP or conflict) -> validate -> classify -> match -> outcome. A conflict still records validation results in `all_reasons`.", implements: "FR-INT-02; FR-INT-03; FR-INT-04", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-INT-05, param: false, statement: "Matching is exact string equality (NFC + trim) on registered keys; 0 hits -> UNMATCHED_REF, 1 -> link, >1 -> AMBIGUOUS_MATCH.", implements: "FR-INT-05; FR-ID-02", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-INT-06, param: false, statement: "Untrusted text never reaches decision parameters; payload `state`/`quality_flag`/`subtype` are stored as source attributes only.", implements: "FR-INT-07; PNFR-13", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-INT-07, param: true, statement: "Contract binding default is `record_only` for every source; `enforce` is per-source configuration (OD-S12-11).", implements: "FR-INT-04", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-INT-08, param: false, statement: "Duplicates (`NOOP_DUPLICATE`) are excluded from every queue, total and metric by definition of the outcome views.", implements: "FR-INT-02; PNFR-11", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-ID-01, param: false, statement: "Rule links only by registered exact key; no similarity of any kind.", implements: "FR-ID-02; ADR-009", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-ID-02, param: false, statement: "Orphan counts are reported measures; orphans are never repaired by the product.", implements: "FR-ID-02; FR-MET-07; DQ-24", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-ID-03, param: false, statement: "A human link needs a registered pair, a reason and an authenticated human reviewer-class role; it is an event.", implements: "FR-ID-01; FR-ID-02", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-RUN-01, param: false, statement: "No hidden capacity cap: every limit is configuration, printed in the run record; remaining work is counted and checkpointed.", implements: "FR-RUN-03; BR-12", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-RUN-02, param: false, statement: "One active run per job; a dead run is closed by RUN_ABANDONED.", implements: "FR-RUN-02", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-RUN-03, param: false, statement: "Jobs never perform Zone H actions.", implements: "FR-GATE-01; FR-RUN-01", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-RUN-04, param: true, statement: "`schedule.enabled` defaults false; enabling is ZH-09 (OD-S12-10).", implements: "FR-RUN-01", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-MET-01, param: false, statement: "A metric involving closed, resolved, approved, cost or handling time must name a `definition_tag`.", implements: "FR-MET-01", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-MET-02, param: false, statement: "Values with different tags or tag-policy versions are never summed, averaged or compared.", implements: "FR-MET-02", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-MET-03, param: false, statement: "Median = mean of middle two for even n; p90 = nearest-rank ceil(0.9 n); n=0 gives null.", implements: "FR-MET-03", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-MET-04, param: false, statement: "Money is `Decimal`; no float arithmetic; rounding (ROUND_HALF_EVEN) only at presentation.", implements: "FR-MET-04; NFR-16", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-MET-05, param: false, statement: "An unparsable amount is an error, never skipped; partial results are flagged.", implements: "FR-MET-04", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-MET-06, param: false, statement: "Every KPI output carries window, denominator, exclusions, tag and 'synthetic, unvalidated' while data are synthetic.", implements: "FR-MET-06; PNFR-20", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-MET-07, param: false, statement: "`operating_costs.total_cases` is never 'cases created' (OD-07).", implements: "FR-MET-04", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-SEC-01, param: false, statement: "Deny by default for routes, fields, roles and unknown access levels.", implements: "FR-SEC-01; FR-SEC-03", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-SEC-02, param: false, statement: "Audit record is written in the same transaction as the audited change; failure aborts the change.", implements: "FR-SEC-02; PNFR-09", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-SEC-03, param: false, statement: "Hold-all: no delete path for retained tables until a retention policy is adopted (OPD-09).", implements: "PNFR-10", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-CO-01, param: false, statement: "A difference from a Stage 7 golden is acceptable only if it is in the deviation register with status `approved` and an approval reference (HAR-06).", implements: "FR-CO-01; BR-13", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-CO-02, param: false, statement: "Executable acceptance runs only in a full repo copy outside the working tree (OD-03a), with manifest verification after.", implements: "FR-CO-01", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}
  - {id: SBR-CO-03, param: false, statement: "No AI, LLM or ML call or dependency; no model-inference egress.", implements: "FR-CO-04; PNFR-18", epistemic_status: verified_fact, evidence: [docs/12-specs/business-rules.md]}

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: hub_session
    bearer:
      type: http
      scheme: bearer
  schemas:
    TransitionRequest:
      type: object
      description: Request shape (informal types in 'x-types'; machine-strict JSON Schema generation is a Stage 13/15 task)
      x-types:
        to_state: enum case_status
        event_type: STATUS_CHANGE|REOPEN
        basis: string<=2000
        evidence_refs: array<ev_id>
        expected_seq: integer
        occurred_at: ISO UTC (optional)
      required:
      - to_state
      - event_type
      - basis
      - expected_seq
    EventPage:
      type: object
      description: Response shape (informal types in 'x-types'; machine-strict JSON Schema generation is a Stage 13/15 task)
      x-types:
        items: array<decision-event>
        next: cursor|null
      required:
      - items
    CaseStateView:
      type: object
      description: Response shape (informal types in 'x-types'; machine-strict JSON Schema generation is a Stage 13/15 task)
      x-types:
        case_id: string
        state: enum
        as_of: ISO UTC
        cycle: integer
        last_seq: integer
      required:
      - case_id
      - state
      - as_of
    EventWithEvidence:
      type: object
      description: Response shape (informal types in 'x-types'; machine-strict JSON Schema generation is a Stage 13/15 task)
      x-types:
        event: decision-event
        evidence: array<evidence-record|{ev_id,access:denied}|{ev_id,unresolvable:true}>
      required:
      - event
      - evidence
    FactRequest:
      type: object
      description: Request shape (informal types in 'x-types'; machine-strict JSON Schema generation is a Stage 13/15 task)
      x-types:
        fact_type: FACT_OPS_CLOSED|FACT_EVIDENCE_COMPLETE
        occurred_at: ISO UTC (optional)
        basis: string
        expected_seq: integer
      required:
      - fact_type
      - expected_seq
    EvidenceRequest:
      type: object
      description: Request shape (informal types in 'x-types'; machine-strict JSON Schema generation is a Stage 13/15 task)
      x-types:
        kind: document|intake_item|crosswalk_object|external_ref
        source: string
        source_ref: string
        source_hash: string (optional)
        access_level: engineering|quality|operations|restricted
      required:
      - kind
      - source
      - source_ref
      - access_level
    EvidencePack:
      type: object
      description: Response shape (informal types in 'x-types'; machine-strict JSON Schema generation is a Stage 13/15 task)
      x-types:
        case: object
        history: array<decision-event>
        linked_objects: object by type incl. 'none found'
        evidence: array
        rule_traces: array<rule-result>
        open_findings: array
        overrides: array
        policy_versions: object
        active_rulesets: object
        pack_hash: sha256
      required:
      - case
      - history
      - linked_objects
      - evidence
      - rule_traces
      - pack_hash
    ZoneHRequest:
      type: object
      description: Request shape (informal types in 'x-types'; machine-strict JSON Schema generation is a Stage 13/15 task)
      x-types:
        action: ZH-01..ZH-10
        case_id: string (ZH-01..04)
        payload: object by action (decision, basis, evidence_refs, external reference, policy ref, mode, values, schedule flag...)
        pack_hash: sha256 (ZH-01..03)
        authority_ref: string non-empty
        reauth_token: string from OP-SEC-05
      required:
      - action
      - authority_ref
      - reauth_token
    ZoneHResult:
      type: object
      description: Response shape (informal types in 'x-types'; machine-strict JSON Schema generation is a Stage 13/15 task)
      x-types:
        action: ZH-xx
        event_ref: string
        mode_at_write: event|external_ref|null
        audit_seq: integer
      required:
      - action
      - event_ref
      - audit_seq
    GateStatus:
      type: object
      description: Response shape (informal types in 'x-types'; machine-strict JSON Schema generation is a Stage 13/15 task)
      x-types:
        mode: none|event|external_ref
        values_set: boolean
        holders_configured: integer
        available: boolean
      required:
      - mode
      - values_set
      - holders_configured
      - available
    OverrideRequest:
      type: object
      description: Request shape (informal types in 'x-types'; machine-strict JSON Schema generation is a Stage 13/15 task)
      x-types:
        action: override|dismiss|refuse
        reason: string non-empty
        replacement: any (optional)

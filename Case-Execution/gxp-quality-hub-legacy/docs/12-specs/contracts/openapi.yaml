# OpenAPI 3.0.3 - Stage 12 v0.1 DRAFT (synthetic, unvalidated). x-* extensions carry roles/requirements for Stage 13 traceability.
openapi: 3.0.3
info:
  title: GxP Quality Hub target API (Stage 12 spec)
  version: 0.1.0-draft
  description: DRAFT specification of the NEW /api/v2 surface. Synthetic, unvalidated. Legacy /api/* is untouched. Schemas referenced by relative
    file path.
servers:
- url: http://127.0.0.1:8081
security:
- session: []
- bearer: []
paths:
  /api/v2/cases/{case_id}/transitions:
    post:
      operationId: OP_DEC_01
      summary: 'Append a state-changing decision event (BEH-DEC-01..10). With close_exception the call is Zone H: use OP-GATE-02 ZH-04.'
      x-op-id: OP-DEC-01
      x-roles:
      - reviewer
      - quality_lead
      - compliance
      x-implements:
      - FR-DEC-01
      - FR-DEC-03
      - FR-DEC-05
      x-release: R1
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: schemas/decision-event.schema.json
        '401':
          description: E-AUTH-UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: schemas/error-envelope.schema.json
        '403':
          description: E-AUTH-FORBIDDEN or E-GATE-NOT-AUTHORISED
          content:
            application/json:
              schema:
                $ref: schemas/error-envelope.schema.json
        4xx:
          description: 'Errors: E-DEC-IMMUTABLE, E-DEC-TIME-ORDER, E-DEC-REOPEN-EXPLICIT, E-DEC-EVIDENCE-REQUIRED, E-DEC-EVIDENCE-UNRESOLVED,
            E-DEC-SEQ-CONFLICT, E-DEC-IDEMPOTENCY-MISMATCH, E-DEC-NOOP, E-DEC-CASE-NOT-FOUND, E-DEC-FIELD-TOO-LONG, E-GATE-NOT-AUTHORISED (status
            per error-handling-spec.md)'
          content:
            application/json:
              schema:
                $ref: schemas/error-envelope.schema.json
  /api/v2/cases/{case_id}/events:
    get:
      operationId: OP_DEC_02
      summary: List events of a case in seq order (cursor paging, limit<=100).
      x-op-id: OP-DEC-02
